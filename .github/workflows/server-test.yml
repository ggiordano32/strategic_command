name: server-test
on:
  push:
    paths: ["server/**", ".github/workflows/server-test.yml"]
  pull_request:
    paths: ["server/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server
